; Live copy of /home/octoglow/octoglowd/supervisord-config.conf on the device.
; /etc/supervisor/conf.d/octoglowd.conf is a symlink to it, so this one file defines every
; octoglow supervisord program - not just octoglowd. Edit here, deploy, reload.
;
; deploy.sh uploads this as supervisord-config.conf.new and does NOT install it, because
; replacing the live file also replaces the gpio and resetbutton definitions below. To adopt it:
;
;   ssh octoglow
;   diff /home/octoglow/octoglowd/supervisord-config.conf /home/octoglow/octoglowd/supervisord-config.conf.new
;   cp /home/octoglow/octoglowd/supervisord-config.conf.new /home/octoglow/octoglowd/supervisord-config.conf
;   supervisorctl reread && supervisorctl update && supervisorctl restart octoglowd
;
; The JVM flags on octoglowd are the only thing changed from what was running before; see the
; notes at the bottom of this file.

[program:octoglowd]
command=java -Xms64m -Xmx64m -XX:MaxMetaspaceSize=48m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Xss256k -Dkotlinx.coroutines.io.parallelism=4 -Djava.awt.headless=true -Xlog:gc*:file=/home/octoglow/octoglowd/gc.log:time,uptime:filecount=3,filesize=2M -jar octoglowd.jar

directory=/home/octoglow/octoglowd
user=octoglow
autostart=true
startsecs=8
stopwaitsecs=6

#stdout_logfile=/var/log/octoglowd/console.log
stdout_logfile=/home/octoglow/octoglowd/console.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
redirect_stderr=true

[program:octoglowd-debug]
command=java -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9204 -Dcom.sun.management.jmxremote.rmi.port=9204 -Djava.rmi.server.hostname=127.0.0.1 -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -jar octoglowd.jar

directory=/home/octoglow/octoglowd
user=octoglow
autostart=false
startsecs=8
stopwaitsecs=6

stdout_logfile=/var/log/octoglowd/console-debug.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
redirect_stderr=true

[eventlistener:gpio]
command=/usr/bin/python3 running-proc-gpio-eventlistener.py octoglowd 19
directory=/home/octoglow/gpio
stdout_logfile=/var/log/gpio/eventlistener-stdout.log
stderr_logfile=/var/log/gpio/eventlistener-stdout.log
priority=-1
events=PROCESS_STATE
startsecs=3
stopwaitsecs=3
autorestart=false

[program:resetbutton]
command=/home/octoglow/gpio/reset-button-handler.sh
directory=/home/octoglow/gpio
stdout_logfile=/var/log/gpio/resetbutton.log
startsecs=2
autorestart=false
redirect_stderr=true

; ---------------------------------------------------------------------------------------------
; Notes on the octoglowd JVM flags. Target hardware: Orange Pi Zero, Allwinner sun8i
; (quad-core ARMv7 Cortex-A7), 231 MB usable RAM, root filesystem on an SD card.
;
; -XX:TieredStopAtLevel=1  C1 only. This replaces -XX:-TieredCompilation, which did the opposite
;                          of what it looks like: it disabled C1 and left C2 as the only compiler,
;                          so code ran interpreted until the C2 threshold and was then compiled by
;                          the slowest, most memory-hungry compiler - on a Cortex-A7 core. C1
;                          compiles quickly, needs little code cache, and is fast enough here.
;
; -Xms64m = -Xmx64m        Was -Xms16m -Xmx64m. A growing and shrinking heap costs a full
;                          stop-the-world SerialGC on every resize; committing it up front removes
;                          that. Do not raise -Xmx without reading gc.log first: on a 231 MB box a
;                          bigger heap trades GC pauses for swapping.
;
; -XX:+UseSerialGC         Correct for this machine; the JVM picks it by ergonomics anyway.
;
; -XX:MaxMetaspaceSize=48m Raised from 32m, which is tight for Kotlin + ktor + SQLDelight. A
;                          metaspace-triggered full GC looks exactly like a heap one.
;
; -Xss256k                 The process runs dozens of threads (coroutine dispatchers, ktor CIO,
;                          ktor-mqtt, tinylog, SQLite, I2C); smaller stacks save committed memory.
;
; -Dkotlinx.coroutines.io.parallelism=4
;                          Dispatchers.IO defaults to 64 threads and would otherwise grow there.
;
; -Xlog:gc*                Rotated GC log capped at 6 MB total. Correlate any remaining freezes
;                          against full-GC pauses here before tuning further.
;
; Add -Dtinylog.level=debug to raise log verbosity without rebuilding the jar.
