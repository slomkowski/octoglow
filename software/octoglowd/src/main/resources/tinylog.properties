# Production level. Override without a rebuild with -Dtinylog.level=debug on the JVM command line.
# Keeping this at debug is expensive: kotlin-logging evaluates every `logger.debug { }` lambda, and
# several of them sit in the 40 ms front display loop and in the per-insert database path.
level = info
writingthread = true
level@eu.slomkowski = info
level@io.moquette = warn
level@io.netty = warn


writer = console
writer.level = info
writer.format = {date: yyy-MM-dd HH:mm:ss.SSS} [{thread}] {level} {class-name} - {message}
